/* ==================== Hugging Face helper ====================
 * We send a prompt in Bengali that requests an ordered numbered list.
 * Response parsing is naive but robust for "1. task" numbered outputs.
 */
async function getPrioritizedTasksFromHF(taskTitles){
  if(!HF_API_KEY || HF_API_KEY==="YOUR_HF_API_KEY"){
    throw new Error("HF_API_KEY not set. Replace HF_API_KEY in code with your Hugging Face token.");
  }

  // Build prompt (Bengali)
  const prompt = `তোমার কাজগুলো নিচে দেওয়া হলো, প্রতিটা কাজকে গুরুত্বের (priority) ক্রমে সাজাও — সবচেয়ে জরুরি থেকে কম জরুরি। প্রতিটি কাজকে সংখ্যায় (1., 2., 3.) লিখে দাও, এবং প্রতিটি লাইনে শুধুমাত্র: "1. কাজের নাম" এই ফরম্যাটে রাখো। কাজগুলো: ${taskTitles.join(" || ")}।`;

  // You can change model; flan-t5 variants work well. Using "google/flan-t5-large" as inference endpoint.
  const model = "google/flan-t5-large";
  
  const res = await fetch(`https://api-inference.huggingface.co/models/${model}`, {
    method: "POST",
    headers: {
      Authorization: `Bearer ${HF_API_KEY}`,
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ inputs: prompt, options:{wait_for_model:true, use_cache:false}, parameters:{max_new_tokens:256} })
  });

  if(!res.ok){
    const txt = await res.text();
    throw new Error("HF request failed: " + res.status + " " + txt);
  }
  const data = await res.json();
  // different HF models return different shapes; many return {generated_text: "..."} or an array
  let text = "";
  if(Array.isArray(data) && data[0]?.generated_text) text = data[0].generated_text;
  else if(data.generated_text) text = data.generated_text;
  else if(typeof data === 'string') text = data;
  else text = JSON.stringify(data);

  // Normalize line breaks and parse numbered list
  const lines = text.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  const ordered = [];
  for(const ln of lines){
    // match "1. something" or "1) something" or "১." (bengali digit)
    const m = ln.match(/^\s*[\d\u09E6-\u09EF]+[\.\)]\s*(.+)$/);
    if(m && m[1]) ordered.push(m[1].trim());
    else {
      // fallback: if there are separators "||" maybe model returned joined text
      // break by " || " or comma
      if(ln.includes("||")){
        ln.split("||").map(x=>x.trim()).forEach(x=>{ if(x) ordered.push(x); });
      } else {
        ordered.push(ln);
      }
    }
  }

  // As a last resort, if ordered is empty, split by "||" from prompt
  if(ordered.length===0) ordered.push(...taskTitles);

  return {raw:text, ordered};
}

function App(){
  const [user,setUser]=useState(null);
  const [lists,setLists]=useState([]);
  const [active,setActive]=useState(null);
  const [tasks,setTasks]=useState([]);

    const normalized = arr.map((t,i)=>({ ...t, priority: t.priority!=null? t.priority : 99999 }));
    setTasks(normalized);
  }); return ()=>unsub(); },[user,active]);

  const signIn=()=>signInWithPopup(auth,new GoogleAuthProvider());
  const signOutNow=()=>signOut(auth);

  const addList=async()=>{ const name=prompt('লিস্টের নাম দিন'); if(name&&user){ await addDoc(collection(db,'users',user.uid,'lists'),{name}); } };

  const addTask=async({title,delayMs})=>{ if(user&&active){ const data={title,completed:false,createdAt:serverTimestamp()}; if(delayMs){ data.reminderAt=new Date(Date.now()+delayMs).toISOString(); } // set large default priority at add
      data.priority = 99999;
      await addDoc(collection(db,'users',user.uid,'lists',active,'tasks'),data);
      if(delayMs) scheduleLocalReminder(title,delayMs);
    }
  };

  const toggleTask=async(t)=>{ if(!user) return; await updateDoc(doc(db,'users',user.uid,'lists',active,'tasks',t.id),{completed:!t.completed}); };
  const delTask=async(t)=>{ if(!user) return; if(!confirm('Delete this task?')) return; await deleteDoc(doc(db,'users',user.uid,'lists',active,'tasks',t.id)); };

  /* AI prioritize flow */
  const runAiPrioritize = async ()=>{
    if(!user || !active) return alert('প্রথমে Google দিয়ে লগইন করে লিস্ট সিলেক্ট করো।');
    if(tasks.length<1) return alert('টাস্ক খালি আছে। প্রথমে কিছু টাস্ক যোগ করো।');
    setAiLoading(true);
    try{
      // prepare titles (short)
      const titles = tasks.map(t=>t.title);
      const res = await getPrioritizedTasksFromHF(titles);
      setAiResult(res);
      setAiOpen(true);
    }catch(err){
      alert('AI error: ' + (err.message || err));
      console.error(err);
    }finally{ setAiLoading(false); }
  };

  // apply the AI ordered list by updating each task's .priority field in Firestore
  const applyAiOrdered = async (orderedTitles)=>{
    if(!user || !active) return;
    // Map orderedTitles to task ids as best-effort by matching titles (exact or fuzzy)
    const titleToIds = {};
    tasks.forEach(t=>{
      const key = t.title.trim().toLowerCase();
      if(!titleToIds[key]) titleToIds[key]=[];
      titleToIds[key].push(t.id);
    });

    // For approximate matching (if exact match fails), we try find by includes
    const updates = [];
    for(let i=0;i<orderedTitles.length;i++){
      const ot = orderedTitles[i].trim();
      const key = ot.toLowerCase();
      let id = null;
      if(titleToIds[key] && titleToIds[key].length>0) {
        id = titleToIds[key].shift(); // consume one
      } else {
        // find first task whose title includes ot or ot includes title
        const found = tasks.find(t=>{
          const tt = t.title.toLowerCase();
          return tt.includes(key) || key.includes(tt);
        });
        if(found) id = found.id;
      }
      if(id){
        updates.push({id,priority:i});
      } else {
        // if couldn't match, try to find next unmatched task and set its priority
        const unmatched = tasks.find(t=>!updates.some(u=>u.id===t.id));
        if(unmatched) updates.push({id:unmatched.id,priority:i});
      }
    }

    // For any remaining tasks not in ordered list, append them after
    let nextPriority = orderedTitles.length;
    tasks.forEach(t=>{
      if(!updates.some(u=>u.id===t.id)){
        updates.push({id:t.id,priority:nextPriority++});
      }
    });

    try{

        await updateDoc(doc(db,'users',user.uid,'lists',active,'tasks',u.id),{priority:u.priority});
      }
      alert('AI priority applied ✅');
      setAiOpen(false);
    }catch(e){

    }
  };

    React.createElement(Header,{user,onSignIn:signIn,onSignOut:signOutNow}),

    user && React.createElement(Tabs,{lists,active,onSelect:setActive,onAdd:addList}),

    user && active && React.createElement('div',null, 
      React.createElement('div',{style:{display:'flex',gap:8,marginBottom:8,alignItems:'center'}},
        React.createElement('button',{className:'btn secondary',onClick:runAiPrioritize,disabled:aiLoading}, aiLoading ? 'AI চলছে...' : '🤖 AI দিয়ে সাজাও'),
        React.createElement('button',{className:'btn ghost',onClick:async ()=>{ // reset priorities to createdAt order
            if(!confirm('প্রায়োরিটি রিসেট করলে নতুন অর্ডার তৈরি হবে। চালিয়ে যেতে চাও?')) return;
            try{
              // set all priorities = 99999 so createdAt order takes over
              for(const t of tasks){
                await updateDoc(doc(db,'users',user.uid,'lists',active,'tasks',t.id),{priority:99999});
              }
              alert('Priority reset হয়েছে।');
            }catch(e){ alert('রিসেট ব্যর্থ: '+(e.message||e)); }
        }},'Reset Priority'),
        React.createElement('label',{style:{marginLeft:'auto',display:'flex',alignItems:'center',gap:8}}, React.createElement('input',{type:'checkbox',checked:showOrder,onChange:e=>setShowOrder(e.target.checked)}),'Show priority index')
      )
    ),

    user && active && React.createElement(TaskList,{tasks,onToggle:toggleTask,onDelete:delTask,showOrder}),

    React.createElement(AiModal,{open:aiOpen,onClose:()=>setAiOpen(false),aiResult,onApply:applyAiOrdered})
  );
}

/* Render */
createRoot(document.getElementById('root')).render(React.createElement(App));
  </script>
</body>
</html>
